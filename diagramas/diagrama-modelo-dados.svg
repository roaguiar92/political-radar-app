  <text x="472" y="292" font-size="10" fill="#1F2937">email</text>
  <text x="630" y="292" font-size="10" fill="#6366F1">TEXT</text>
  <text x="718" y="292" font-size="10" fill="#9CA3AF">nullable</text>
  <line x1="460" y1="300" x2="760" y2="300" stroke="#E5E7EB" stroke-width="0.8"/>

