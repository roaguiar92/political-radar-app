  <text x="240" y="162" font-size="10" fill="#6366F1">UUID</text>
  <text x="320" y="162" font-size="10" fill="#9CA3AF">PK</text>
  <line x1="80" y1="170" x2="360" y2="170" stroke="#E5E7EB" stroke-width="0.8"/>

