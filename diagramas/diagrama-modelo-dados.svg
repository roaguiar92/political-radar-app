  <text x="220" y="380" text-anchor="middle" font-size="9" fill="#6B7280">e supabase.auth.sign_in_with_password()</text>
  <text x="220" y="395" text-anchor="middle" font-size="9" fill="#6B7280">Retorna: access_token + refresh_token (JWT)</text>

