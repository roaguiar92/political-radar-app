  <rect x="460" y="80" width="300" height="36" rx="8" fill="#7C3AED"/>
  <text x="610" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">public.deputados</text>
  <rect x="460" y="116" width="300" height="340" rx="0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="460" y="448" width="300" height="8" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>

