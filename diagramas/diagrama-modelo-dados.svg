  <rect x="460" y="378" width="300" height="26" fill="#FEFEFE"/>
  <text x="472" y="396" font-size="10" fill="#1F2937">uf_nascimento</text>
  <text x="630" y="396" font-size="10" fill="#6366F1">TEXT</text>
  <line x1="460" y1="404" x2="760" y2="404" stroke="#E5E7EB" stroke-width="0.8"/>

  <!-- last_fetched_at -->
  <rect x="460" y="404" width="300" height="26" fill="#FFF7ED"/>
  <text x="472" y="422" font-size="10" fill="#1F2937">last_fetched_at</text>
  <text x="630" y="422" font-size="10" fill="#6366F1">TIMESTAMPTZ</text>
  <text x="718" y="422" font-size="10" fill="#EA580C">TTL 24h</text>
