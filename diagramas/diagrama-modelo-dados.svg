<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="820" height="500" fill="#F8F9FA" rx="12"/>

  <!-- Title -->
  <text x="410" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A2E">Modelo de Dados — Supabase</text>
  <line x1="60" y1="55" x2="760" y2="55" stroke="#DEE2E6" stroke-width="1.5"/>

  <!-- ── auth.users ── -->
  <!-- Table header -->
  <rect x="80" y="80" width="280" height="36" rx="8" fill="#0D9488"/>
  <text x="220" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">auth.users</text>
  <!-- Table body -->
  <rect x="80" y="116" width="280" height="284" rx="0" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <rect x="80" y="392" width="280" height="8" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>

  <!-- Rows auth.users -->
  <!-- Header row -->
  <rect x="80" y="116" width="280" height="28" fill="#F0FDFA"/>
  <text x="106" y="134" font-size="10" font-weight="700" fill="#0F766E">Coluna</text>
  <text x="240" y="134" font-size="10" font-weight="700" fill="#0F766E">Tipo</text>
  <text x="320" y="134" font-size="10" font-weight="700" fill="#0F766E">Info</text>
  <line x1="80" y1="144" x2="360" y2="144" stroke="#99F6E4" stroke-width="1"/>

  <!-- id -->
  <rect x="80" y="144" width="280" height="26" fill="#FEFEFE"/>
