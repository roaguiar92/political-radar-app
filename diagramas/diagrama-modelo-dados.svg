  <!-- Note upsert -->
  <rect x="490" y="458" width="240" height="24" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="610" y="474" text-anchor="middle" font-size="9.5" fill="#5B21B6">Operação: UPSERT por id</text>

  <!-- Relationship line (logical, not FK) -->
  <line x1="360" y1="300" x2="460" y2="300" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="410" y="294" text-anchor="middle" font-size="9" fill="#6B7280">contexto</text>
  <text x="410" y="308" text-anchor="middle" font-size="9" fill="#6B7280">lógico</text>

  <!-- Legend -->
  <rect x="60" y="460" width="360" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="84" y="478" font-size="9" fill="#374151">🔑 Chave primária</text>
  <text x="190" y="478" font-size="9" fill="#374151">— — —  Relação lógica (sem FK)</text>
  <text x="370" y="478" font-size="9" fill="#EA580C">TTL = controle manual</text>

