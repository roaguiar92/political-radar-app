  <rect x="120" y="430" width="200" height="28" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="220" y="449" text-anchor="middle" font-size="10" fill="#1D4ED8">Retorna JWT para o Frontend</text>

