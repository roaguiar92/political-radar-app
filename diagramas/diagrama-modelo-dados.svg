  <rect x="460" y="196" width="300" height="26" fill="#FEFEFE"/>
  <text x="472" y="214" font-size="10" fill="#1F2937">sigla_partido</text>
  <text x="630" y="214" font-size="10" fill="#6366F1">TEXT</text>
  <text x="718" y="214" font-size="10" fill="#9CA3AF">nullable</text>
