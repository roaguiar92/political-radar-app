  <rect x="460" y="222" width="300" height="26" fill="#FEFEFE"/>
  <text x="472" y="240" font-size="10" fill="#1F2937">sigla_uf</text>
  <text x="630" y="240" font-size="10" fill="#6366F1">TEXT</text>
  <text x="718" y="240" font-size="10" fill="#9CA3AF">nullable</text>
  <line x1="460" y1="248" x2="760" y2="248" stroke="#E5E7EB" stroke-width="0.8"/>

