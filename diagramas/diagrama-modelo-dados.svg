  <rect x="460" y="116" width="300" height="28" fill="#F5F3FF"/>
  <text x="490" y="134" font-size="10" font-weight="700" fill="#6D28D9">Coluna</text>
  <text x="630" y="134" font-size="10" font-weight="700" fill="#6D28D9">Tipo</text>
  <text x="718" y="134" font-size="10" font-weight="700" fill="#6D28D9">Info</text>
  <line x1="460" y1="144" x2="760" y2="144" stroke="#DDD6FE" stroke-width="1"/>

